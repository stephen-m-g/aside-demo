<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1100" viewBox="0 0 850 1100" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="850" height="1100" fill="#fffefa"/><text x="70" y="96" font-size="30" font-weight="700" fill="#1f2937">Cellular Respiration Worksheet</text><text x="70" y="134" font-size="18" fill="#6b7280">Bio 102 · Unit 4</text><text x="560" y="134" font-size="18" fill="#6b7280">Name ____________________</text><line x1="70" y1="160" x2="780" y2="160" stroke="#1f2937" stroke-width="2"/><text x="425" y="1060" font-size="16" fill="#6b7280" text-anchor="middle">Page 1 of 2</text><text x="70" y="220" font-size="21" fill="#1f2937"><tspan font-weight="700">1.</tspan> Write the overall equation for cellular respiration.</text><line x1="90" y1="262" x2="780" y2="262" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="302" x2="780" y2="302" stroke="#cbd5e1" stroke-width="1.5"/><text x="70" y="380" font-size="21" fill="#1f2937"><tspan font-weight="700">2.</tspan> Where in the cell does glycolysis happen? What does it produce?</text><line x1="90" y1="422" x2="780" y2="422" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="462" x2="780" y2="462" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="502" x2="780" y2="502" stroke="#cbd5e1" stroke-width="1.5"/><text x="70" y="580" font-size="21" fill="#1f2937"><tspan font-weight="700">3.</tspan> Why is the inner membrane of the mitochondrion folded into cristae?</text><line x1="90" y1="622" x2="780" y2="622" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="662" x2="780" y2="662" stroke="#cbd5e1" stroke-width="1.5"/><line x1="90" y1="702" x2="780" y2="702" stroke="#cbd5e1" stroke-width="1.5"/><text x="70" y="780" font-size="21" fill="#1f2937"><tspan font-weight="700">4.</tspan> Fill in the ATP made at each stage:</text><g font-size="20"><rect x="90" y="815" width="200" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="190" y="855" text-anchor="middle" font-weight="600" fill="#1f2937">Glycolysis</text><text x="190" y="905" text-anchor="middle" fill="#6b7280">____ ATP</text><rect x="330" y="815" width="200" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="430" y="855" text-anchor="middle" font-weight="600" fill="#1f2937">Krebs cycle</text><text x="430" y="905" text-anchor="middle" fill="#6b7280">____ ATP</text><rect x="570" y="815" width="200" height="110" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="670" y="855" text-anchor="middle" font-weight="600" fill="#1f2937">ETC</text><text x="670" y="905" text-anchor="middle" fill="#6b7280">____ ATP</text></g></svg>
