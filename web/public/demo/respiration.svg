<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><rect width="1200" height="800" fill="#ffffff"/><text x="48" y="70" font-size="34" font-weight="700" fill="#1f2937">Cellular respiration</text><text x="48" y="106" font-size="22" fill="#6b7280">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energy (ATP)</text><rect x="60" y="190" width="230" height="120" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/><text x="175.0" y="240" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">Glucose</text><text x="175.0" y="276" font-size="21" fill="#6b7280" text-anchor="middle">C₆H₁₂O₆</text><rect x="370" y="190" width="260" height="120" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><text x="500.0" y="240" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">Glycolysis</text><text x="500.0" y="276" font-size="21" fill="#6b7280" text-anchor="middle">cytoplasm</text><rect x="710" y="190" width="230" height="120" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="825.0" y="240" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">2 Pyruvate</text><text x="825.0" y="276" font-size="21" fill="#6b7280" text-anchor="middle">into the mitochondrion</text><rect x="370" y="450" width="260" height="120" rx="22" fill="#fff1f2" stroke="#dc2626" stroke-width="4"/><text x="500.0" y="500" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">Krebs cycle</text><text x="500.0" y="536" font-size="21" fill="#6b7280" text-anchor="middle">matrix</text><rect x="710" y="450" width="430" height="120" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="4"/><text x="925.0" y="500" font-size="28" font-weight="700" fill="#1f2937" text-anchor="middle">Electron transport chain</text><text x="925.0" y="536" font-size="21" fill="#6b7280" text-anchor="middle">inner membrane (cristae)</text><line x1="290" y1="250" x2="348.0" y2="250.0" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><polygon points="366,250 348.0,240.0 348.0,260.0" fill="#1f2937"/><line x1="630" y1="250" x2="688.0" y2="250.0" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><polygon points="706,250 688.0,240.0 688.0,260.0" fill="#1f2937"/><line x1="825" y1="310" x2="576.0" y2="437.8" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><polygon points="560,446 580.6,446.7 571.4,428.9" fill="#1f2937"/><line x1="630" y1="510" x2="688.0" y2="510.0" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><polygon points="706,510 688.0,500.0 688.0,520.0" fill="#1f2937"/><g transform="translate(500 365)"><rect x="-62" y="-28" width="124" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text y="10" font-size="24" font-weight="700" fill="#92400e" text-anchor="middle">2 ATP</text></g><g transform="translate(500 625)"><rect x="-62" y="-28" width="124" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text y="10" font-size="24" font-weight="700" fill="#92400e" text-anchor="middle">2 ATP</text></g><g transform="translate(925 625)"><rect x="-62" y="-28" width="124" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text y="10" font-size="24" font-weight="700" fill="#92400e" text-anchor="middle">~32 ATP</text></g><text x="800" y="410" font-size="22" fill="#6b7280">NADH, FADH₂ carry electrons</text><text x="160" y="520" font-size="24" fill="#1f2937" text-anchor="middle">CO₂ out</text><line x1="366" y1="510" x2="258.0" y2="510.0" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><polygon points="240,510 258.0,520.0 258.0,500.0" fill="#94a3b8"/><text x="1040" y="700" font-size="24" fill="#1f2937" text-anchor="middle">O₂ in → H₂O</text><line x1="1040" y1="670" x2="1040.0" y2="592.0" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/><polygon points="1040,574 1030.0,592.0 1050.0,592.0" fill="#94a3b8"/></svg>
